[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nuextract3-studio"
version = "0.1.0"
description = "Document intelligence studio powered by NuExtract3 (vLLM + FastAPI + Streamlit)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Helmi Ghanmi" }]
keywords = ["nuextract", "vllm", "document-ai", "ocr", "structured-extraction", "vlm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "pymupdf>=1.24,<2",
  "pillow>=10.4",
  "json-repair>=0.30",
  "typer>=0.12",
  "rich>=13.9",
  "streamlit>=1.40",
]

[project.optional-dependencies]
local = [
  "torch>=2.4",
  "transformers>=4.56",
  "accelerate>=1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.12",
]

[project.scripts]
nuextract = "nuextract_app.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nuextract_app"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"apps/streamlit/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["apps/streamlit/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["integration: requires a running vLLM server or GPU"]

[tool.coverage.run]
source = ["src/nuextract_app"]
